plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.myoverlay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.myoverlay'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = 'GoldEg.apk'
        }
    }
}
